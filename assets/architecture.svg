<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="mcpBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#6366f1" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="900" height="400" rx="16" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700" fill="#1e293b">Career Copilot 多平台架构</text>

  <!-- ===== LEFT: Direct Entry Nodes ===== -->
  <g filter="url(#soft)">
    <rect x="30" y="62" width="150" height="72" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="105" y="94" text-anchor="middle" font-family="Inter,ui-sans-serif,sans-serif" font-size="15" font-weight="600" fill="#1e293b">Web 工作台</text>
    <text x="105" y="115" text-anchor="middle" font-family="Inter,ui-sans-serif,sans-serif" font-size="11" fill="#64748b">可视化操作 · 独立使用</text>
  </g>

  <g filter="url(#soft)">
    <rect x="30" y="152" width="150" height="72" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="105" y="184" text-anchor="middle" font-family="Inter,ui-sans-serif,sans-serif" font-size="15" font-weight="600" fill="#1e293b">CLI 工具</text>
    <text x="105" y="205" text-anchor="middle" font-family="Inter,ui-sans-serif,sans-serif" font-size="11" fill="#64748b">命令行求职 · 本地运行</text>
  </g>

  <!-- ===== CENTER: Career Copilot Engine ===== -->
  <g filter="url(#soft)">
    <rect x="300" y="80" width="280" height="130" rx="20" fill="url(#accent)"/>
    <text x="440" y="132" text-anchor="middle" font-family="Inter,ui-sans-serif,sans-serif" font-size="22" font-weight="700" fill="white">Career Copilot</text>
    <text x="440" y="160" text-anchor="middle" font-family="Inter,ui-sans-serif,sans-serif" font-size="13" fill="#e0e7ff">证据驱动的 AI 求职引擎</text>
    <rect x="335" y="175" width="210" height="22" rx="11" fill="white" fill-opacity="0.15"/>
    <text x="440" y="190" text-anchor="middle" font-family="Inter,ui-sans-serif,sans-serif" font-size="11" fill="white">岗位发现 · JD深拆 · 简历定制 · 投递跟踪 · 面试复盘</text>
  </g>

  <!-- ===== RIGHT: MCP → Multi-Platform ===== -->
  <!-- MCP Bar -->
  <rect x="620" y="62" width="250" height="72" rx="12" fill="url(#mcpBar)" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="745" y="91" text-anchor="middle" font-family="Inter,ui-sans-serif,sans-serif" font-size="14" font-weight="700" fill="#6366f1">MCP 协议 (统一入口)</text>
  <text x="745" y="112" text-anchor="middle" font-family="Inter,ui-sans-serif,sans-serif" font-size="11" fill="#64748b">一个端点 · 全平台通用</text>

  <!-- Platform cards under MCP -->
  <g filter="url(#soft)">
    <rect x="635" y="152" width="105" height="55" rx="10" fill="white" stroke="#cbd5e1" stroke-width="1"/>
    <text x="688" y="175" text-anchor="middle" font-family="Inter,ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#7c3aed">WorkBuddy</text>
    <text x="688" y="193" text-anchor="middle" font-family="Inter,ui-sans-serif,sans-serif" font-size="10" fill="#94a3b8">Expert</text>
  </g>

  <g filter="url(#soft)">
    <rect x="755" y="152" width="105" height="55" rx="10" fill="white" stroke="#cbd5e1" stroke-width="1"/>
    <text x="808" y="175" text-anchor="middle" font-family="Inter,ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#d97706">Claude Code</text>
    <text x="808" y="193" text-anchor="middle" font-family="Inter,ui-sans-serif,sans-serif" font-size="10" fill="#94a3b8">Anthropic</text>
  </g>

  <g filter="url(#soft)">
    <rect x="635" y="222" width="105" height="55" rx="10" fill="white" stroke="#cbd5e1" stroke-width="1"/>
    <text x="688" y="245" text-anchor="middle" font-family="Inter,ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#10a37f">OpenAI Codex</text>
    <text x="688" y="263" text-anchor="middle" font-family="Inter,ui-sans-serif,sans-serif" font-size="10" fill="#94a3b8">OpenAI</text>
  </g>

  <g filter="url(#soft)">
    <rect x="755" y="222" width="105" height="55" rx="10" fill="white" stroke="#cbd5e1" stroke-width="1"/>
    <text x="808" y="245" text-anchor="middle" font-family="Inter,ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#0f766e">OpenCode</text>
    <text x="808" y="263" text-anchor="middle" font-family="Inter,ui-sans-serif,sans-serif" font-size="10" fill="#94a3b8">开源</text>
  </g>

  <!-- ===== Arrows: Left → Center ===== -->
  <path d="M180 100 H295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M180 190 H295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Arrows: Center → Right (MCP) ===== -->
  <path d="M580 100 H615" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Arrows: MCP → Platforms ===== -->
  <path d="M740 134 L740 148" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M750 134 L805 148" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M740 134 L688 148" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M750 134 L808 218" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Bottom: Capability pills -->
  <g>
    <rect x="80" y="340" width="108" height="28" rx="14" fill="#e0e7ff"/>
    <text x="134" y="358" text-anchor="middle" font-family="Inter,ui-sans-serif,sans-serif" font-size="12" font-weight="500" fill="#4338ca">岗位发现</text>

    <rect x="206" y="340" width="108" height="28" rx="14" fill="#e0e7ff"/>
    <text x="260" y="358" text-anchor="middle" font-family="Inter,ui-sans-serif,sans-serif" font-size="12" font-weight="500" fill="#4338ca">JD 深拆</text>

    <rect x="332" y="340" width="108" height="28" rx="14" fill="#e0e7ff"/>
    <text x="386" y="358" text-anchor="middle" font-family="Inter,ui-sans-serif,sans-serif" font-size="12" font-weight="500" fill="#4338ca">简历定制</text>

    <rect x="458" y="340" width="108" height="28" rx="14" fill="#e0e7ff"/>
    <text x="512" y="358" text-anchor="middle" font-family="Inter,ui-sans-serif,sans-serif" font-size="12" font-weight="500" fill="#4338ca">投递管理</text>

    <rect x="584" y="340" width="108" height="28" rx="14" fill="#e0e7ff"/>
    <text x="638" y="358" text-anchor="middle" font-family="Inter,ui-sans-serif,sans-serif" font-size="12" font-weight="500" fill="#4338ca">面试复盘</text>

    <rect x="710" y="340" width="108" height="28" rx="14" fill="#e0e7ff"/>
    <text x="764" y="358" text-anchor="middle" font-family="Inter,ui-sans-serif,sans-serif" font-size="12" font-weight="500" fill="#4338ca">数据洞察</text>
  </g>

  <!-- Bottom legend -->
  <text x="450" y="392" text-anchor="middle" font-family="Inter,ui-sans-serif,sans-serif" font-size="11" fill="#94a3b8">MCP 协议让 WorkBuddy / Claude Code / OpenAI Codex / OpenCode 共用同一引擎</text>
</svg>