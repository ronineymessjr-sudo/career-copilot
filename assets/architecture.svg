<svg viewBox="0 0 680 520" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" style="font-family:Inter,ui-sans-serif,system-ui,sans-serif">
  <title>Career Copilot V2 系统架构图</title>
  <desc>展示 Web、CLI、MCP、WorkBuddy Expert 四个入口，通过 Next.js API 路由访问 OpenAI、Tavily、Supabase 和 Cloudflare Workers 的系统架构。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- User Entry Layer -->
  <rect x="40" y="20" width="600" height="80" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="340" y="42" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-size="14" font-weight="500">用户入口层</text>

  <rect x="70" y="55" width="110" height="36" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="125" y="73" text-anchor="middle" dominant-baseline="central" fill="#26215C" font-size="13" font-weight="500">Web App</text>

  <rect x="210" y="55" width="110" height="36" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="265" y="73" text-anchor="middle" dominant-baseline="central" fill="#26215C" font-size="13" font-weight="500">CLI</text>

  <rect x="350" y="55" width="130" height="36" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="415" y="73" text-anchor="middle" dominant-baseline="central" fill="#26215C" font-size="13" font-weight="500">WorkBuddy Expert</text>

  <rect x="510" y="55" width="100" height="36" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="560" y="73" text-anchor="middle" dominant-baseline="central" fill="#26215C" font-size="13" font-weight="500">MCP</text>

  <!-- API / Control Layer -->
  <line x1="125" y1="91" x2="125" y2="125" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="265" y1="91" x2="265" y2="125" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="415" y1="91" x2="415" y2="125" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="560" y1="91" x2="560" y2="125" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="40" y="130" width="600" height="80" rx="12" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="340" y="152" text-anchor="middle" dominant-baseline="central" fill="#042C53" font-size="14" font-weight="500">API 与控制层</text>

  <rect x="80" y="165" width="110" height="36" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="135" y="183" text-anchor="middle" dominant-baseline="central" fill="#042C53" font-size="13" font-weight="500">App Router</text>

  <rect x="220" y="165" width="120" height="36" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="280" y="183" text-anchor="middle" dominant-baseline="central" fill="#042C53" font-size="13" font-weight="500">Agent Runtime</text>

  <rect x="370" y="165" width="110" height="36" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="425" y="183" text-anchor="middle" dominant-baseline="central" fill="#042C53" font-size="13" font-weight="500">异步队列</text>

  <rect x="510" y="165" width="110" height="36" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="565" y="183" text-anchor="middle" dominant-baseline="central" fill="#042C53" font-size="13" font-weight="500">Feedback API</text>

  <!-- AI Service Layer -->
  <line x1="340" y1="210" x2="340" y2="245" stroke="#378ADD" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="180" y="250" width="320" height="80" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="340" y="272" text-anchor="middle" dominant-baseline="central" fill="#04342C" font-size="14" font-weight="500">AI 服务层</text>

  <rect x="210" y="285" width="110" height="36" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="265" y="303" text-anchor="middle" dominant-baseline="central" fill="#04342C" font-size="13" font-weight="500">OpenAI</text>

  <rect x="360" y="285" width="110" height="36" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="415" y="303" text-anchor="middle" dominant-baseline="central" fill="#04342C" font-size="13" font-weight="500">Tavily</text>

  <!-- Data & Scheduler -->
  <line x1="280" y1="320" x2="200" y2="355" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="400" y1="320" x2="480" y2="355" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="40" y="360" width="220" height="70" rx="12" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <text x="150" y="382" text-anchor="middle" dominant-baseline="central" fill="#4A1B0C" font-size="13" font-weight="500">Supabase</text>
  <text x="150" y="402" text-anchor="middle" dominant-baseline="central" fill="#712B13" font-size="12">PostgreSQL · Auth · Storage</text>

  <rect x="280" y="360" width="180" height="70" rx="12" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <text x="370" y="382" text-anchor="middle" dominant-baseline="central" fill="#4A1B0C" font-size="13" font-weight="500">Scheduler Worker</text>
  <text x="370" y="402" text-anchor="middle" dominant-baseline="central" fill="#712B13" font-size="12">Cloudflare Cron</text>

  <rect x="490" y="360" width="150" height="70" rx="12" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <text x="565" y="382" text-anchor="middle" dominant-baseline="central" fill="#4A1B0C" font-size="13" font-weight="500">Cloudflare</text>
  <text x="565" y="402" text-anchor="middle" dominant-baseline="central" fill="#712B13" font-size="12">Workers · Pages</text>

  <text x="340" y="465" text-anchor="middle" fill="#5F5E5A" font-size="12" font-weight="400">Cloudflare 托管 · Supabase 持久化 · OpenAI + Tavily 提供智能 · 开源可复用</text>
</svg>