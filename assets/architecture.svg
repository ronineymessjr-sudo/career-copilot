<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Career Copilot product architecture</title>
  <desc id="desc">Web, CLI and MCP entry points flow into the Career Copilot engine, then into the Cloudflare and Supabase runtime.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#081321"/>
      <stop offset="0.55" stop-color="#0b1b2f"/>
      <stop offset="1" stop-color="#06101d"/>
    </linearGradient>
    <linearGradient id="engine" x1="360" y1="180" x2="840" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b65d8"/>
      <stop offset="0.55" stop-color="#147cf5"/>
      <stop offset="1" stop-color="#0eb9d8"/>
    </linearGradient>
    <linearGradient id="runtime" x1="910" y1="180" x2="1110" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#122b46"/>
      <stop offset="1" stop-color="#0d1d31"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#4fdcff"/>
      <stop offset="1" stop-color="#1e7cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#48cfff"/>
    </marker>
  </defs>

  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <path d="M0 120H1200M0 260H1200M0 400H1200M0 540H1200" stroke="#5ccfff" stroke-opacity=".06"/>
  <path d="M160 0V680M420 0V680M680 0V680M940 0V680" stroke="#5ccfff" stroke-opacity=".05"/>
  <circle cx="630" cy="254" r="205" fill="#0b66d8" opacity=".12" filter="url(#glow)"/>

  <text x="72" y="76" fill="#f7fbff" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="30" font-weight="750">Career Copilot</text>
  <text x="72" y="108" fill="#9bb4c9" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="15">One workspace for the job-search loop</text>

  <!-- Entry points -->
  <g filter="url(#shadow)">
    <rect x="72" y="174" width="220" height="76" rx="16" fill="#10243a" stroke="#2e83cf" stroke-opacity=".7"/>
    <rect x="72" y="270" width="220" height="76" rx="16" fill="#10243a" stroke="#2e83cf" stroke-opacity=".7"/>
    <rect x="72" y="366" width="220" height="76" rx="16" fill="#10243a" stroke="#2e83cf" stroke-opacity=".7"/>
  </g>
  <g font-family="Inter,ui-sans-serif,system-ui,sans-serif">
    <circle cx="104" cy="212" r="16" fill="#0a6ede"/><path d="M96 212h16M104 204v16" stroke="#e7f7ff" stroke-width="2"/>
    <text x="134" y="208" fill="#f5fbff" font-size="17" font-weight="700">Web Demo</text><text x="134" y="230" fill="#91acc2" font-size="12">Try the workflow</text>
    <circle cx="104" cy="308" r="16" fill="#13a4b8"/><path d="M96 306h16M96 312h10" stroke="#e7f7ff" stroke-width="2"/>
    <text x="134" y="304" fill="#f5fbff" font-size="17" font-weight="700">Web Workbench</text><text x="134" y="326" fill="#91acc2" font-size="12">Save and review</text>
    <circle cx="104" cy="404" r="16" fill="#eb886b"/><path d="m97 409 5-10 5 10 5-10" fill="none" stroke="#fff7f3" stroke-width="2"/>
    <text x="134" y="400" fill="#f5fbff" font-size="17" font-weight="700">CLI / MCP</text><text x="134" y="422" fill="#91acc2" font-size="12">Compose your entry</text>
  </g>

  <!-- Engine -->
  <g filter="url(#shadow)">
    <rect x="360" y="160" width="430" height="260" rx="26" fill="url(#engine)"/>
    <rect x="380" y="180" width="390" height="220" rx="19" fill="#06172b" fill-opacity=".24" stroke="#b9efff" stroke-opacity=".25"/>
  </g>
  <g font-family="Inter,ui-sans-serif,system-ui,sans-serif">
    <circle cx="424" cy="224" r="20" fill="#e9fbff" fill-opacity=".18"/><path d="M414 224h20M424 214v20" stroke="#d8f9ff" stroke-width="2.5"/>
    <text x="464" y="227" fill="#fff" font-size="23" font-weight="750">Career Copilot engine</text>
    <text x="402" y="273" fill="#e2f8ff" font-size="14">Discover → understand → match → prepare</text>
    <g fill="#e9fbff" fill-opacity=".9"><rect x="402" y="305" width="145" height="38" rx="12"/><rect x="561" y="305" width="180" height="38" rx="12"/></g>
    <g fill="#0c4d85" font-size="12" font-weight="700"><text x="474" y="329" text-anchor="middle">Grounded evidence</text><text x="651" y="329" text-anchor="middle">Tailored materials</text></g>
    <path d="M402 365h339" stroke="#b9efff" stroke-opacity=".35"/><text x="402" y="388" fill="#d4f5ff" font-size="12">Jobs · resumes · applications · interviews</text>
  </g>

  <!-- Runtime -->
  <g filter="url(#shadow)"><rect x="860" y="160" width="270" height="260" rx="26" fill="url(#runtime)" stroke="#2c86bb" stroke-opacity=".65"/></g>
  <g font-family="Inter,ui-sans-serif,system-ui,sans-serif">
    <text x="892" y="212" fill="#f6fcff" font-size="20" font-weight="750">Runtime</text>
    <text x="892" y="238" fill="#94b3c8" font-size="12">Deploy once, use everywhere</text>
    <g><rect x="892" y="270" width="206" height="38" rx="11" fill="#153957"/><circle cx="914" cy="289" r="7" fill="#27c9e5"/><text x="934" y="294" fill="#e5faff" font-size="13" font-weight="650">Cloudflare Worker</text></g>
    <g><rect x="892" y="318" width="206" height="38" rx="11" fill="#153957"/><circle cx="914" cy="337" r="7" fill="#2c8aff"/><text x="934" y="342" fill="#e5faff" font-size="13" font-weight="650">Scheduler</text></g>
    <g><rect x="892" y="366" width="206" height="38" rx="11" fill="#153957"/><circle cx="914" cy="385" r="7" fill="#ff9c81"/><text x="934" y="390" fill="#e5faff" font-size="13" font-weight="650">Supabase</text></g>
  </g>

  <!-- Flow -->
  <path d="M292 212H346M292 308H346M292 404H346" stroke="url(#line)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M790 290H846" stroke="url(#line)" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="346" cy="212" r="5" fill="#54dcff"/><circle cx="346" cy="308" r="5" fill="#54dcff"/><circle cx="346" cy="404" r="5" fill="#54dcff"/><circle cx="846" cy="290" r="5" fill="#54dcff"/>

  <!-- Capabilities -->
  <text x="72" y="510" fill="#ccebf8" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700">One continuous loop</text>
  <g font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="650">
    <g><rect x="72" y="536" width="156" height="54" rx="15" fill="#10243a" stroke="#24577f"/><circle cx="96" cy="563" r="8" fill="#27c9e5"/><text x="116" y="568" fill="#e5faff">Discover</text></g>
    <g><rect x="244" y="536" width="156" height="54" rx="15" fill="#10243a" stroke="#24577f"/><circle cx="268" cy="563" r="8" fill="#2c8aff"/><text x="288" y="568" fill="#e5faff">Understand</text></g>
    <g><rect x="416" y="536" width="156" height="54" rx="15" fill="#10243a" stroke="#24577f"/><circle cx="440" cy="563" r="8" fill="#70e3bd"/><text x="460" y="568" fill="#e5faff">Match</text></g>
    <g><rect x="588" y="536" width="156" height="54" rx="15" fill="#10243a" stroke="#24577f"/><circle cx="612" cy="563" r="8" fill="#ff9c81"/><text x="632" y="568" fill="#e5faff">Prepare</text></g>
    <g><rect x="760" y="536" width="156" height="54" rx="15" fill="#10243a" stroke="#24577f"/><circle cx="784" cy="563" r="8" fill="#c38cff"/><text x="804" y="568" fill="#e5faff">Review</text></g>
  </g>
  <path d="M938 563h154" stroke="#3bc9e8" stroke-opacity=".5" stroke-dasharray="5 7"/>
  <circle cx="1103" cy="563" r="11" fill="#ff9c81"/><path d="m1098 563 4 4 7-8" stroke="#071421" stroke-width="2" fill="none"/>
</svg>
