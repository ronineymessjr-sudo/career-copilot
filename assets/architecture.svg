<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="840" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#6366f1" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="840" height="320" rx="16" fill="url(#bg)"/>

  <!-- Title -->
  <text x="420" y="36" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1e293b">Career Copilot 多入口架构</text>

  <!-- Entry nodes -->
  <g filter="url(#soft)">
    <rect x="40" y="70" width="150" height="80" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="115" y="105" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1e293b">Web 工作台</text>
    <text x="115" y="128" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">可视化操作</text>
  </g>

  <g filter="url(#soft)">
    <rect x="40" y="170" width="150" height="80" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="115" y="205" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1e293b">CLI 工具</text>
    <text x="115" y="228" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">命令行求职</text>
  </g>

  <g filter="url(#soft)">
    <rect x="650" y="70" width="150" height="80" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="725" y="105" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1e293b">WorkBuddy 专家</text>
    <text x="725" y="128" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">对话式顾问</text>
  </g>

  <g filter="url(#soft)">
    <rect x="650" y="170" width="150" height="80" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="725" y="205" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1e293b">MCP 工具</text>
    <text x="725" y="228" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">接入任意 Agent</text>
  </g>

  <!-- Center hub -->
  <g filter="url(#soft)">
    <rect x="295" y="100" width="250" height="120" rx="20" fill="url(#accent)"/>
    <text x="420" y="150" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="white">Career Copilot</text>
    <text x="420" y="180" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#e0e7ff">证据驱动的 AI 求职引擎</text>
  </g>

  <!-- Arrows -->
  <path d="M190 110 H290" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M190 130 H290" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M190 210 H290" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M190 230 H290" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M545 110 H645" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M545 130 H645" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M545 210 H645" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M545 230 H645" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Bottom capability pills -->
  <g>
    <rect x="80" y="280" width="110" height="28" rx="14" fill="#e0e7ff"/>
    <text x="135" y="298" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#4338ca">岗位发现</text>

    <rect x="210" y="280" width="110" height="28" rx="14" fill="#e0e7ff"/>
    <text x="265" y="298" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#4338ca">JD 深拆</text>

    <rect x="340" y="280" width="110" height="28" rx="14" fill="#e0e7ff"/>
    <text x="395" y="298" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#4338ca">简历定制</text>

    <rect x="470" y="280" width="110" height="28" rx="14" fill="#e0e7ff"/>
    <text x="525" y="298" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#4338ca">投递跟踪</text>

    <rect x="600" y="280" width="110" height="28" rx="14" fill="#e0e7ff"/>
    <text x="655" y="298" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#4338ca">面试复盘</text>
  </g>
</svg>