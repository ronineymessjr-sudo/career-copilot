services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: career_copilot
      POSTGRES_USER: career_copilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-career_copilot_local}
    ports:
      - "5432:5432"
    volumes:
      - career-copilot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career_copilot -d career_copilot"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./apps/api
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/data:/app/data
      - ./prototype:/workspace/prototype:ro
      - ./assets:/workspace/assets:ro
    environment:
      CAREER_COPILOT_DB: /app/data/career_copilot.db
      APPROVAL_FIRST: "true"
      MODEL_PROVIDER: ${MODEL_PROVIDER:-mock}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-http://host.docker.internal:11434}
      MODEL_NAME: ${MODEL_NAME:-qwen2.5:3b}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-45}
      DATA_BACKEND: ${DATA_BACKEND:-sqlite}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      SUPABASE_ACCESS_TOKEN: ${SUPABASE_ACCESS_TOKEN:-}
      SUPABASE_USER_ID: ${SUPABASE_USER_ID:-}
      CAREER_COPILOT_ADMIN_TOKEN: ${CAREER_COPILOT_ADMIN_TOKEN:-local-demo-token}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
    depends_on:
      api:
        condition: service_healthy

volumes:
  career-copilot-postgres:
