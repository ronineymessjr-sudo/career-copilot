name: Engineering Evidence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      CAREER_COPILOT_DB: ${{ github.workspace }}/apps/api/data/ci_evidence.db
      MODEL_PROVIDER: mock
      CAREER_COPILOT_ADMIN_TOKEN: ci-local-only
      CAREER_COPILOT_EVIDENCE_ENDPOINT: ${{ secrets.CAREER_COPILOT_EVIDENCE_ENDPOINT }}
      CAREER_COPILOT_EVIDENCE_ADMIN_TOKEN: ${{ secrets.CAREER_COPILOT_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install API dependencies
        run: pip install -r requirements.txt

      - name: Run tests with JUnit evidence
        run: python -m pytest -q --junitxml=junit.xml

      - name: Collect Git and CI evidence
        env:
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REF: ${{ github.sha }}
        run: |
          if ! git -C ../.. cat-file -e "${BASE_REF}^{commit}" 2>/dev/null; then
            if git -C ../.. rev-parse HEAD~1 >/dev/null 2>&1; then
              BASE_REF="$(git -C ../.. rev-parse HEAD~1)"
            else
              BASE_REF="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
            fi
          fi
          python scripts/collect_git_evidence.py \
            --repo ../.. \
            --base "${BASE_REF}" \
            --head "${HEAD_REF}" \
            --junit junit.xml \
            --ci-run-url "${CI_RUN_URL}" \
            --output engineering_evidence.json

      - name: Validate benchmark pipeline without external model calls
        run: python scripts/run_model_benchmark.py --suite ci-mock-pipeline --max-cases 4 --output model_benchmark.json

      - name: Upload auditable evidence
        uses: actions/upload-artifact@v4
        with:
          name: career-copilot-engineering-evidence
          path: |
            apps/api/junit.xml
            apps/api/engineering_evidence.json
            apps/api/model_benchmark.json
          retention-days: 30

      - name: Push evidence to deployed Career Copilot
        if: ${{ env.CAREER_COPILOT_EVIDENCE_ENDPOINT != '' && env.CAREER_COPILOT_EVIDENCE_ADMIN_TOKEN != '' }}
        env:
          ENDPOINT: ${{ env.CAREER_COPILOT_EVIDENCE_ENDPOINT }}
          ADMIN_TOKEN: ${{ env.CAREER_COPILOT_EVIDENCE_ADMIN_TOKEN }}
        run: |
          python - <<'PY'
          import json
          data = json.load(open("engineering_evidence.json", encoding="utf-8"))
          json.dump(data["delivery_run"], open("delivery_payload.json", "w", encoding="utf-8"), ensure_ascii=False)
          PY
          curl --fail --silent --show-error \
            -H "X-Admin-Token: ${ADMIN_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @delivery_payload.json \
            "${ENDPOINT}"
