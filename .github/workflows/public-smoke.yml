name: Public smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check public endpoints
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://career-copilot-v2.photomagic.workers.dev/"
            "https://career-copilot-v2.photomagic.workers.dev/playground"
            "https://career-copilot-v2.photomagic.workers.dev/api/runtime"
            "https://career-copilot-v2.photomagic.workers.dev/api/mcp"
            "https://career-copilot-scheduler.photomagic.workers.dev/health"
          )
          for url in "${urls[@]}"; do
            status="$(
              curl \
                --silent \
                --show-error \
                --location \
                --retry 5 \
                --retry-all-errors \
                --retry-delay 2 \
                --connect-timeout 15 \
                --max-time 60 \
                --output /tmp/smoke-body \
                --write-out "%{http_code}" \
                "$url"
            )"
            printf "%s -> %s\n" "$url" "$status"
            if [ "$status" != "200" ]; then
              cat /tmp/smoke-body
              printf "\n"
            fi
            test "$status" = "200"
          done

          curl \
            --silent \
            --show-error \
            --fail \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 2 \
            "https://career-copilot-scheduler.photomagic.workers.dev/health" \
            | jq --exit-status \
              '.configured == true and .transport == "cloudflare-service-binding"'

          control_status="$(curl --silent --output /tmp/control-body --write-out "%{http_code}" \
            "https://career-copilot-v2.photomagic.workers.dev/api/control/agents/run")"
          test "$control_status" = "401"

          queue_status="$(curl --silent --output /tmp/queue-body --write-out "%{http_code}" \
            -X POST -H "Content-Type: application/json" --data '{}' \
            "https://career-copilot-v2.photomagic.workers.dev/api/queue/submit")"
          test "$queue_status" = "401"
